# CI: taskflow-infra
# Uso: desde la raíz del proyecto -> docker compose -f infra/docker-compose.yml up --build
services:
  taskflow:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - taskflow-data:/app/data
    environment:
      - PORT=3000

volumes:
  taskflow-data:
